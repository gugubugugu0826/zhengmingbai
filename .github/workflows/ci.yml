name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 前端类型检查
        run: npm run typecheck --workspace=web --if-present

      - name: 前端构建
        run: npm run build --workspace=web --if-present

  server-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      # v3.1 T03：server 单测（node:test + tsx --test；存量 TS2352 类型错误为已知项，typecheck 暂不入门禁）
      - name: 后端单元测试
        run: npx tsx --test 'src/**/*.test.ts'
        working-directory: server

  # v3.2 T03（条目 3.2）：密钥扫描硬门禁——全量 git 历史 + 工作区，与 build/test 并行
  # 背景：qa-admin-token.txt 有效 JWT 入仓事故（已 BFG 清史），此 job 防再犯
  # allowlist 规则见仓库根 .gitleaks.toml（放行测试假 token / 文档 / 已知非密项）
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（全历史，供 gitleaks 扫全量提交）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks 密钥扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          # 公开仓库/自研项目免费档，无需 GITLEAKS_LICENSE
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: true
