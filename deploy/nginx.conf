# 「整明白」生产 nginx 站点配置（2026-07-24 自现网 /etc/nginx/sites-enabled/zhengmingbai 取回归档）
# 部署位置：/etc/nginx/sites-available/zhengmingbai，软链到 sites-enabled/
# HTTPS 证书由 Certbot 管理（Let's Encrypt），ssl_certificate 路径勿手改
server {
  server_name zhengmingbai.cn www.zhengmingbai.cn;
  root /opt/zhengmingbai/web-dist;
  index index.html;
  client_max_body_size 60m;

  # API 反代（Express 监听 127.0.0.1:3001，不对公网暴露）
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  # 健康检查（探活直连后端）
  location /health { proxy_pass http://127.0.0.1:3001; }
  # SPA 前端路由兜底
  location / { try_files $uri /index.html; }

  listen 443 ssl; # managed by Certbot
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  ssl_certificate /etc/letsencrypt/live/zhengmingbai.cn/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/zhengmingbai.cn/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP → HTTPS 301 跳转（Certbot 生成）
server {
  if ($host = www.zhengmingbai.cn) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  if ($host = zhengmingbai.cn) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  listen 80;
  server_name zhengmingbai.cn www.zhengmingbai.cn;
  return 404; # managed by Certbot
}
